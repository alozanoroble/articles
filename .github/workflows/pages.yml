name: Deploy to GitHub Pages

# The legacy Jekyll builder failed instantly (0 ms, "Page build failed") when
# Pages was first enabled on this repo, so the site is deployed as a plain
# static upload through Actions instead. Nothing here is built or transformed:
# index.html, README.md and papers/ are published exactly as committed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
